services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bd_spa
      POSTGRES_USER: spa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambiar-en-produccion}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - spa_postgres:/var/lib/postgresql/data
      - ./spa-api/scripts/crear_esquema_spa.sql:/docker-entrypoint-initdb.d/001_esquema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spa -d bd_spa"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./spa-api
    environment:
      APP_ENV: ${APP_ENV:-development}
      PORT: 8080
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      DATABASE_URL: postgres://spa:${POSTGRES_PASSWORD:-cambiar-en-produccion}@postgres:5432/bd_spa?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET con al menos 32 caracteres}
      UPLOAD_DIR: /data/uploads
      CLIENT_APP_DIR: /app/ClientApp
      AI_PROVIDER: ${AI_PROVIDER:-local}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    ports:
      - "8080:8080"
    volumes:
      - spa_uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  spa_postgres:
  spa_uploads:

