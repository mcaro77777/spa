openapi: 3.1.0
info:
  title: MiSpA API
  version: 0.1.0
  description: API del MVP de apoyo tributario MiSpA IA. Los cálculos son estimaciones y no sustituyen declaraciones oficiales.
servers:
  - url: /api
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      summary: Comprueba API y PostgreSQL
      responses:
        '200': { description: Servicio disponible }
        '503': { $ref: '#/components/responses/Problema' }
  /auth/register:
    post:
      security: []
      summary: Registra un usuario e inicia una sesión
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Registro' }
      responses:
        '200': { $ref: '#/components/responses/Token' }
        '409': { $ref: '#/components/responses/Problema' }
        '422': { $ref: '#/components/responses/Problema' }
  /auth/login:
    post:
      security: []
      summary: Inicia una sesión
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credenciales' }
      responses:
        '200': { $ref: '#/components/responses/Token' }
        '401': { $ref: '#/components/responses/Problema' }
  /auth/refresh:
    post:
      security: []
      summary: Rota el refresh token y entrega un access token
      responses:
        '200': { $ref: '#/components/responses/Token' }
        '401': { $ref: '#/components/responses/Problema' }
  /auth/logout:
    post:
      security: []
      summary: Revoca la sesión asociada a la cookie
      responses:
        '204': { description: Sesión cerrada }
  /auth/me:
    get:
      summary: Devuelve usuario, empresas y empresa activa
      responses:
        '200':
          description: Sesión actual
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sesion' }
        '401': { $ref: '#/components/responses/Problema' }
  /auth/select-company:
    post:
      summary: Selecciona una empresa autorizada para la sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [empresaId]
              properties: { empresaId: { type: string, format: uuid } }
      responses:
        '200': { $ref: '#/components/responses/Token' }
        '403': { $ref: '#/components/responses/Problema' }
  /companies:
    get:
      summary: Lista las empresas del usuario
      responses:
        '200':
          description: Empresas autorizadas
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/EmpresaResumen' } }
    post:
      summary: Crea una empresa y asigna al usuario como propietario
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmpresaEntrada' }
      responses:
        '201':
          description: Empresa creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmpresaResumen' }
        '409': { $ref: '#/components/responses/Problema' }
        '422': { $ref: '#/components/responses/Problema' }
  /imports/invoices:
    post:
      summary: Importa el CSV canónico de documentos tributarios
      parameters:
        - in: header
          name: Idempotency-Key
          schema: { type: string, maxLength: 200 }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivo]
              properties: { archivo: { type: string, format: binary } }
      responses:
        '201':
          description: Archivo procesado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Importacion' }
        '413': { $ref: '#/components/responses/Problema' }
        '422': { $ref: '#/components/responses/Problema' }
  /imports:
    get:
      summary: Lista las últimas importaciones de la empresa activa
      responses:
        '200':
          description: Historial
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Importacion' } }
  /invoices:
    get:
      summary: Lista documentos tributarios paginados
      parameters:
        - { in: query, name: direction, schema: { type: string, enum: [compra, venta] } }
        - { in: query, name: documentType, schema: { type: string } }
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: dateFrom, schema: { type: string, format: date } }
        - { in: query, name: dateTo, schema: { type: string, format: date } }
        - { in: query, name: counterpartyRut, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Página de documentos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaDocumentos' }
  /dashboard/summary:
    get:
      summary: Obtiene indicadores empresariales preliminares
      parameters:
        - { in: query, name: year, schema: { type: integer, minimum: 2000, maximum: 2200 } }
        - { in: query, name: month, schema: { type: integer, minimum: 0, maximum: 12 } }
      responses:
        '200':
          description: Resumen del período
  /tax/vat-estimate:
    get:
      summary: Estima IVA débito, crédito y saldo del período
      parameters:
        - { in: query, name: year, schema: { type: integer } }
        - { in: query, name: month, schema: { type: integer, minimum: 1, maximum: 12 } }
      responses:
        '200': { description: Estimación trazable de IVA }
  /reports/purchases-sales.xlsx:
    get:
      summary: Descarga compras y ventas del período en Excel
      parameters:
        - { in: query, name: year, schema: { type: integer } }
        - { in: query, name: month, schema: { type: integer, minimum: 0, maximum: 12 } }
      responses:
        '200':
          description: Libro Excel
          content: { application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: {} }
  /reports/vat-estimate.pdf:
    get:
      summary: Descarga la estimación mensual de IVA en PDF
      parameters:
        - { in: query, name: year, schema: { type: integer } }
        - { in: query, name: month, schema: { type: integer, minimum: 1, maximum: 12 } }
      responses:
        '200':
          description: Reporte PDF
          content: { application/pdf: {} }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    Problema:
      description: Error compatible con RFC 9457
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    Token:
      description: Access token y contexto de empresa
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Token' }
  schemas:
    Registro:
      type: object
      required: [nombre, correo, contrasena]
      properties:
        nombre: { type: string, minLength: 1 }
        apellido: { type: string }
        correo: { type: string, format: email }
        contrasena: { type: string, minLength: 10, writeOnly: true }
    Credenciales:
      type: object
      required: [correo, contrasena]
      properties:
        correo: { type: string, format: email }
        contrasena: { type: string, writeOnly: true }
    Token:
      type: object
      required: [accessToken, expiresIn]
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer, description: Segundos }
        empresaId: { type: [string, 'null'], format: uuid }
    EmpresaResumen:
      type: object
      required: [id, razonSocial, rut]
      properties:
        id: { type: string, format: uuid }
        razonSocial: { type: string }
        nombreFantasia: { type: [string, 'null'] }
        rut: { type: string }
        estado: { type: string }
        rol: { type: string }
    EmpresaEntrada:
      type: object
      required: [razonSocial, rut]
      properties:
        razonSocial: { type: string }
        nombreFantasia: { type: string }
        rut: { type: string, examples: ['76.086.428-5'] }
        giro: { type: string }
        correo: { type: string, format: email }
        telefono: { type: string }
        direccion: { type: string }
        comuna: { type: string }
        region: { type: string }
        regimenCodigo: { type: string, default: pro_pyme_general_14d3 }
    Sesion:
      type: object
      properties:
        usuario:
          type: object
          properties: { id: { type: string, format: uuid }, correo: { type: string, format: email } }
        empresaActivaId: { type: [string, 'null'], format: uuid }
        empresas: { type: array, items: { $ref: '#/components/schemas/EmpresaResumen' } }
    Importacion:
      type: object
      properties:
        id: { type: string, format: uuid }
        estado: { type: string, enum: [pendiente, procesando, completado, completado_con_errores, fallido, cancelado] }
        totalFilas: { type: integer }
        filasCreadas: { type: integer }
        filasDuplicadas: { type: integer }
        filasRechazadas: { type: integer }
    Documento:
      type: object
      properties:
        id: { type: string, format: uuid }
        direccion: { type: string, enum: [compra, venta] }
        tipoDocumento: { type: string }
        folio: { type: string }
        fechaEmision: { type: string, format: date }
        montoNeto: { type: string, description: Decimal exacto }
        montoIva: { type: string, description: Decimal exacto }
        montoTotal: { type: string, description: Decimal exacto }
        estadoPago: { type: string }
        estadoRevision: { type: string }
    PaginaDocumentos:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Documento' } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
    Problema:
      type: object
      required: [title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
